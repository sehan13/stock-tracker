<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Stock Tracker{% endblock %} · Stock Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="{{ url_for('stock.dashboard') }}" class="brand">📦 Stock Tracker</a>
      <nav>
        <a href="{{ url_for('stock.dashboard') }}" class="{{ 'active' if request.endpoint == 'stock.dashboard' }}">Dashboard</a>
        <a href="{{ url_for('stock.products') }}" class="{{ 'active' if request.endpoint and 'product' in request.endpoint }}">Products</a>
        <a href="{{ url_for('stock.import_csv') }}" class="{{ 'active' if request.endpoint == 'stock.import_csv' }}">Import CSV</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
